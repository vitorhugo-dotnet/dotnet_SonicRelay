server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Signaling WebSockets carry no traffic between negotiations, and these
        # default to 60s — which silently closed viewer sessions mid-stream.
        # Both ends now ping every 20s, so this only has to outlast a short burst
        # of lost pings rather than a whole idle stream.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
